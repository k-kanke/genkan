server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
  gzip_min_length 1024;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # クラスタの読み取り専用ビュー。同じ Pod の kubectl proxy サイドカー(127.0.0.1:8001)へ
  # pods / nodes / metrics の GET だけを通す。書き込み系や他のリソースは 404。
  location ~ ^/k8s/(api/v1/(pods|nodes)|apis/metrics\.k8s\.io/v1beta1/nodes)$ {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8001/$1$is_args$args;
    proxy_read_timeout 10s;
    add_header Cache-Control "no-store";
  }
  location /k8s/ { return 404; }

  # タスク API(Control Plane)。tasks の GET / POST だけを /api/v1/tasks へ中継する。
  # internal 系や他の API は 404。Service を起動時に引けなくても nginx が落ちないよう、変数でその都度引く。
  resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
  location ~ "^/cp/v1/tasks(?<rest>(/[a-f0-9]{1,32}(/(patch|events|approve|reject))?)?)$" {  # 波括弧を含むので引用符で囲む
    limit_except GET POST { deny all; }
    client_max_body_size 8k;
    set $control_plane http://control-plane.platform-system.svc.cluster.local:8080;
    proxy_pass $control_plane/api/v1/tasks$rest$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;          # SSE(進捗)をそのまま通す
    proxy_read_timeout 1h;
    add_header Cache-Control "no-store";
  }
  location /cp/ { return 404; }

  # 更新がスマホに届くよう、これらはキャッシュさせない
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /registerSW.js { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

  # ハッシュ付きファイルは長期キャッシュ
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
