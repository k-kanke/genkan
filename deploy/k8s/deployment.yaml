apiVersion: apps/v1
kind: Deployment
metadata:
  name: genkan
  namespace: genkan
  labels:
    app: genkan
spec:
  replicas: 1
  selector:
    matchLabels:
      app: genkan
  template:
    metadata:
      labels:
        app: genkan
    spec:
      serviceAccountName: genkan
      # リポジトリ/パッケージを非公開にした場合は有効化（README 参照）
      # imagePullSecrets:
      #   - name: ghcr-pull
      containers:
        - name: genkan
          image: ghcr.io/k-kanke/genkan:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
        # クラスタ読み取り用。127.0.0.1:8001 のみで待ち受け、外には出さない（nginx が GET の一部だけ中継）
        - name: kube-proxy
          image: registry.k8s.io/kubectl:v1.36.6
          args: ["proxy", "--address=127.0.0.1", "--port=8001"]
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 96Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: cache, emptyDir: {} }
