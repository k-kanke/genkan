# Tailscale Operator の Ingress。https://genkan.<TAILNET> で公開される（tailnet 内のみ）
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: genkan
  namespace: genkan
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: genkan
      port:
        number: 80
  tls:
    - hosts:
        - genkan
